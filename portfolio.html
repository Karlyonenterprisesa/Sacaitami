<style>

/* =========================
FUNDO ANIMADO COLORIDO
========================= */
body{
  margin:0;
  font-family:'Montserrat',Arial,sans-serif;
  color:#fff;
  background: linear-gradient(
    135deg,
    #ff4ecd,
    #ffd84d,
    #4dd2ff,
    #ff4d4d
  );
  background-size:400% 400%;
  animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* =========================
TITULO
========================= */
h1{
  text-align:center;
  padding:40px 20px;
  font-size:36px;
  text-shadow:0 3px 10px rgba(0,0,0,0.3);
}

/* =========================
GRID
========================= */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
  padding:20px 40px 60px;
}

/* =========================
CARD
========================= */
.card{
  background:rgba(0,0,0,0.25);
  backdrop-filter: blur(10px);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-6px);
}

/* imagem SEM distorcer */
.card img{
  width:100%;
  height:auto;
  max-height:260px;
  object-fit:contain;
  background:rgba(255,255,255,0.05);
  display:block;
}

/* =========================
BOTÕES
========================= */
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:12px;
  justify-content:center;
}

.actions button,
.actions a{
  border:none;
  cursor:pointer;
  padding:8px 10px;
  font-size:12px;
  border-radius:8px;
  text-decoration:none;
  color:#fff;
  transition:0.3s;
}

.view{background:#111;}
.download{background:#ff2e63;}
.whatsapp{background:#25D366;}

.actions button:hover,
.actions a:hover{
  transform:scale(1.05);
  opacity:0.9;
}

/* =========================
LIGHTBOX
========================= */
.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.92);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.lightbox.active{
  display:flex;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:12px;
  transition: transform 0.3s ease;
  cursor: zoom-in;
}

/* ZOOM */
.lightbox img.zoomed{
  transform: scale(2);
  cursor: zoom-out;
}

/* fechar */
.close{
  position:absolute;
  top:20px;
  right:25px;
  font-size:28px;
  cursor:pointer;
}

.close{background:none;border:0;color:#fff}
.back{display:block;width:max-content;margin:0 auto 50px;background:#111;color:#fff;padding:14px 26px;border-radius:12px;text-decoration:none;font-weight:700}
a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(max-width:600px){.grid{padding:10px 16px 40px}}
@media(prefers-reduced-motion:reduce){body{animation:none}}
</style>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de imagem">
<button type="button" class="close" aria-label="Fechar">✕</button>
<img id="lightbox-img">
</div>

<script>
const lightbox=document.getElementById("lightbox"),lightboxImg=document.getElementById("lightbox-img"),closeBtn=document.querySelector(".close");
function openLb(card){const p=card.querySelector(".preview");lightboxImg.src=p.dataset.full;lightboxImg.alt=p.alt;lightboxImg.classList.remove("zoomed");lightbox.classList.add("active");document.body.style.overflow="hidden";closeBtn.focus();}
function closeLb(){lightbox.classList.remove("active");document.body.style.overflow="";}
document.querySelectorAll(".view").forEach(b=>b.addEventListener("click",()=>openLb(b.closest(".card"))));
closeBtn.addEventListener("click",closeLb);
lightbox.addEventListener("click",e=>{if(e.target===lightbox)closeLb();});
lightboxImg.addEventListener("click",()=>lightboxImg.classList.toggle("zoomed"));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb();});
</script>
